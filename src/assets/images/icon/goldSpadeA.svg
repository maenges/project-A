<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320">
  <defs>
    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2B0"/>
      <stop offset="20%" stop-color="#F5D76E"/>
      <stop offset="45%" stop-color="#E6B94C"/>
      <stop offset="70%" stop-color="#C9972A"/>
      <stop offset="100%" stop-color="#FFF1A8"/>
    </linearGradient>

    <!-- Inner highlight -->
    <linearGradient id="goldHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.65)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Card -->
  <rect x="14" y="14" width="228" height="292" rx="26"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="10"/>

  <!-- Top-left A -->
  <text x="38" y="82"
        font-size="64"
        font-weight="800"
        fill="url(#goldGrad)"
        font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial">
    A
  </text>

  <!-- Bottom-right A (rotated) -->
  <g transform="translate(220 252) rotate(180)">
    <text x="0" y="0"
          font-size="64"
          font-weight="800"
          fill="url(#goldGrad)"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial">
      A
    </text>
  </g>

  <!-- Spade -->
  <path filter="url(#softShadow)" fill="url(#goldGrad)" d="
    M128 88
    C104 112 76 136 76 166
    C76 192 96 212 122 212
    C130 212 138 210 144 206
    C138 232 124 250 100 260
    L100 276
    H156
    V260
    C132 250 118 232 112 206
    C118 210 126 212 134 212
    C160 212 180 192 180 166
    C180 136 152 112 128 88
    Z
  "/>

  <!-- Spade highlight -->
  <path fill="url(#goldHighlight)" d="
    M128 92
    C108 112 88 132 88 156
    C88 170 96 184 112 190
    C114 176 118 160 128 148
    C138 160 142 176 144 190
    C160 184 168 170 168 156
    C168 132 148 112 128 92
    Z
  "/>
</svg>
