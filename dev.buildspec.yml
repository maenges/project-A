version: 0.2

phases:
  install:
    commands:
      - node -v
      - npm -v
      - yarn -v
      - yarn install
  build:
    commands:
      - |
        cat > public/env-config.js << 'EOF'
        window.__ENV = {
          VITE_API_BASE_URL: "$VITE_API_BASE_URL",
          VITE_API_ORIGIN: "$VITE_API_ORIGIN",
          NODE_ENV: "$NODE_ENV"
        };
        EOF
      - echo "==== Generated env-config.js ===="
      - cat public/env-config.js
      - yarn build:dev

artifacts:
  files:
    - '**/*'
  base-directory: dist
